name: Feature request
description: Propose a useful change or capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem first. Prefer the smallest change that solves a real use case.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem should this change solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior. Implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Note existing workarounds or simpler approaches, if any.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What observable outcomes would make this complete?
      placeholder: |
        - [ ] ...
        - [ ] ...
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
